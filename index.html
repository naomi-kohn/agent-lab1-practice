<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Switcher</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">A little color, a little fun</p>
      <h1>Change the mood.</h1>
      <p>Click the button to give this page a new background color.</p>
      <button id="change-color" type="button">Change background</button>
      <p class="color-label" aria-live="polite" aria-atomic="true">Current color: <span id="color-value">#DCEBFF</span></p>
    </main>
  </body>
</html>
